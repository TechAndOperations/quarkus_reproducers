# No broker is needed: the application opens no JMS connection and activates no endpoint.
# The resource adapter is started anyway, and so is the IronJacamar IdleRemover
# (quarkus.ironjacamar.ra.cm.pool.config.idle-timeout-minutes defaults to 30).
quarkus.ironjacamar.ra.kind=artemis
quarkus.artemis.url=tcp://localhost:61616
quarkus.artemis.devservices.enabled=false

# Shows "Awaiting thread pool shutdown; 1 thread(s) running" during the stop
quarkus.log.category."io.quarkus.thread-pool".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
