quarkus.quartz.store-type=ram
quarkus.http.root-path=/rest
quarkus.quartz.clustered=false
quarkus.micrometer.enabled=true
quarkus.http.port=${SERVER_PORT:8081}
quarkus.http.test-port=8081
quarkus.management.enabled=true
# set following to 0 blocks quarkus:dev
#quarkus.management.port=0
# set following to 0 blocks quarkus:test
quarkus.management.test-port=0
#quarkus.micrometer.export.prometheus.enabled=false fixes the error by removing the registration of metrics
