quarkus.http.port=18080

quarkus.smallrye-graphql-client.foo_bar.url=http://${APPHOST:localhost}:18080/graphql

quarkus.http.auth.proactive=false

quarkus.oidc.auth-server-url=http://${KCHOST:localhost}:8543/realms/quarkus

##### option 1 (works up to 3.30) #####

%option1.quarkus.oidc-client.auth-server-url=http://${KCHOST:host.docker.internal}:8543/realms/quarkus
%option1.quarkus.oidc-client.client-id=quarkus-app
%option1.quarkus.oidc-client.credentials.secret=secret
%option1.quarkus.oidc-client.grant.type=password
%option1.quarkus.oidc-client.grant-options.password.username=alice
%option1.quarkus.oidc-client.grant-options.password.password=alice


##### option 2 (required starting at 3.31) #####

%option2.quarkus.oidc-client.foo_bar.auth-server-url=http://${KCHOST:localhost}:8543/realms/quarkus
%option2.quarkus.oidc-client.foo_bar.client-id=quarkus-app
%option2.quarkus.oidc-client.foo_bar.credentials.secret=secret
%option2.quarkus.oidc-client.foo_bar.grant.type=password
%option2.quarkus.oidc-client.foo_bar.grant-options.password.username=alice
%option2.quarkus.oidc-client.foo_bar.grant-options.password.password=alice

## Bind that OIDC client to the GraphQL clients.
%option2.quarkus.oidc-client-graphql.client-name=foo_bar

